<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="tile" x1="64" y1="0" x2="448" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#18264a"/>
      <stop offset="0.55" stop-color="#0d1530"/>
      <stop offset="1" stop-color="#0a0d14"/>
    </linearGradient>
    <radialGradient id="sun" cx="392" cy="392" r="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffe3a8" stop-opacity="0.62"/>
      <stop offset="0.28" stop-color="#7adcec" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#4fc5dc" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glyph" x1="170" y1="90" x2="350" y2="350" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#b6f1fb"/>
      <stop offset="0.5" stop-color="#7adcec"/>
      <stop offset="1" stop-color="#3fb4cf"/>
    </linearGradient>
    <linearGradient id="line" x1="140" y1="0" x2="372" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3fb4cf"/>
      <stop offset="1" stop-color="#9ae6f3"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="clip"><rect width="512" height="512" rx="112"/></clipPath>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" fill="url(#tile)"/>
  <rect width="512" height="512" fill="url(#sun)"/>
  <rect width="512" height="256" fill="url(#gloss)"/>
  <g transform="translate(256 256) scale(0.72) translate(-256 -256)">
    <!-- tres peldaños que suben: la escala -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
    <path d="M160 334 L256 238 L352 334" stroke="url(#glyph)" stroke-width="46"/>
    <path d="M200 222 L256 166 L312 222" stroke="url(#glyph)" stroke-width="34" stroke-opacity="0.72"/>
    <path d="M220 140 L256 104 L292 140" stroke="url(#glyph)" stroke-width="26" stroke-opacity="0.42"/>
  </g>

  <!-- la línea de la marca y su punto de luz -->
  <rect x="140" y="378" width="232" height="26" rx="13" fill="url(#line)" filter="url(#glow)"/>
  <circle cx="392" cy="391" r="15" fill="#e9fbff" filter="url(#glow)"/>
  <circle cx="392" cy="391" r="15" fill="#ffe3a8" fill-opacity="0.55"/>
  </g>
</svg>
